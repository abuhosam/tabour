<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرسان الطابور</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2b24;--mu:#66736c;--pr:#0f6b4f;--prt:#fff;--ac:#e3a008;--bd:#e2ded2;--ok:#0f6b4f;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--tx:#eaf1ed;--mu:#9fb0a7;--pr:#3fb68b;--prt:#06231a;--ac:#f2b933;--bd:#2c3b33;--ok:#3fb68b;--no:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--tx:#eaf1ed;--mu:#9fb0a7;--pr:#3fb68b;--prt:#06231a;--ac:#f2b933;--bd:#2c3b33;--ok:#3fb68b;--no:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{padding:14px 16px 6px}
h1{margin:0;font-size:20px}
header p{margin:0;color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 12px;border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{padding:8px 12px 40px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.b{display:block;width:100%;border:0;background:var(--pr);color:var(--prt);padding:12px;border-radius:10px;font:inherit;font-weight:700;margin-top:8px}
.b.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.msg{text-align:center;padding:18px 10px;border-radius:14px;font-size:20px;font-weight:700;margin-top:10px}
.msg small{display:block;font-size:14px;font-weight:400}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.bad{background:color-mix(in srgb,var(--no) 15%,transparent);color:var(--no)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.rk{width:30px;height:30px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.rk.t{background:var(--ac);color:#222}
.gr{flex:1;min-width:0}.gr b{display:block}.gr span{color:var(--mu);font-size:12px}
.pt{font-weight:700;color:var(--pr);font-size:18px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.seg button.on{background:var(--ac);color:#222;border-color:var(--ac);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pr)}.stat span{font-size:12px;color:var(--mu)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px dashed var(--mu);border-radius:10px;padding:8px;text-align:center;background:#fff;color:#111;font-size:12px}
.card svg{width:90px;height:90px}
video{width:100%;border-radius:12px;margin-top:8px;display:none;background:#000}
.note{color:var(--mu);font-size:12px}
@media print{nav,header,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<header><h1>🏅 فرسان الطابور</h1><p>نموذج أولي لتسجيل الحضور المبكر · الطابور 6:45</p></header>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var K='tabour_v1',S,tab='gate',per=7,last=null,stream=null,scanT=null;
var TABS=[['gate','البوابة'],['rank','الترتيب'],['parent','ولي الأمر'],['cards','البطاقات'],['set','الإعدادات']];
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function seed(){
  var names=['أحمد','محمد','خالد','عبدالله','سعود','فهد','يوسف','عمر','ناصر','سلطان'],fam=['العتيبي','القحطاني','الشمري','الدوسري','الحربي'];
  var st=names.map(function(n,i){return{id:String(1001+i),name:n+' '+fam[i%5],cls:'الخامس '+(i%2?'ب':'أ'),bus:i==9}});
  var rec={},seedv=7,d=new Date(),n=0;
  function rnd(){seedv=(seedv*9301+49297)%233280;return seedv/233280}
  for(var k=1;n<44;k++){var x=new Date();x.setDate(d.getDate()-k);var w=x.getDay();if(w==5||w==6)continue;n++;
    var day={};st.forEach(function(s,i){var hab=[.95,.9,.8,.6,.5,.7,.3,.85,.4,.5][i];if(rnd()>hab+.04)return;
      var m=Math.round(380+(1-hab)*60+rnd()*35);var sec=Math.floor(rnd()*60);day[s.id]=pad(Math.floor(m/60))+':'+pad(m%60)+':'+pad(sec)});
    rec[iso(x)]=day}
  return{students:st,rec:rec}
}
function pad(n){return(n<10?'0':'')+n}
try{var r=localStorage.getItem(K);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
(function(){if(!S.cfg)S.cfg={gap:true,rapid:true,face:false};if(!find('9999')){S.students.push({id:'9999',name:'تجربة (أنا)',cls:'اختبار',bus:false});save()}})();
function tg(k){S.cfg[k]=!S.cfg[k];save();draw()}
function faceOk(){var v=document.getElementById('vid');if(!('FaceDetector' in window)||!stream||!v||v.readyState<2)return Promise.resolve(true);return new FaceDetector().detect(v).then(function(f){return f.length>0}).catch(function(){return true})}
function reg(id){if(S.cfg.face)return faceOk().then(function(ok){if(ok)reg2(id);else{last={bad:1,t:'لا يظهر وجه أمام الكاميرا',sub:'قرّب وجهك مع البطاقة'};beep(0);draw()}});reg2(id)}
function pts(t){return t<'06:30:00'?3:(t<='06:45:59'?2:0)}
function find(id){return S.students.filter(function(s){return s.id==String(id).trim()})[0]}
function now(){var o=document.getElementById('tt');if(o&&/^\d{1,2}:\d{2}$/.test(o.value.trim())){var p=o.value.trim().split(':');return pad(+p[0])+':'+p[1]+':00'}var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function beep(ok){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:300;g.gain.value=.15;o.start();o.stop(a.currentTime+.18)}catch(e){}}
function reg2(id){
  var s=find(id);if(!s){last={bad:1,t:'رقم غير موجود'};beep(0);return draw()}
  var today=iso(new Date());S.rec[today]=S.rec[today]||{};
  if(S.rec[today][s.id]){last={ok:1,t:s.name,sub:'مسجّل مسبقاً '+S.rec[today][s.id].slice(0,5)};beep(1);return draw()}
  var n=Date.now();if(S.cfg.gap&&n-(window.lastScan||0)<3000){last={bad:1,t:'انتظر ٣ ثوانٍ ⏳',sub:'مسح سريع متتالٍ'};beep(0);return draw()}
  window.lastScan=n;window.scans=(window.scans||[]).filter(function(x){return n-x<10000});window.scans.push(n);
  var fl=S.cfg.rapid&&window.scans.length>=3;
  var t=now();S.rec[today][s.id]=t;if(fl){S.flags=S.flags||{};(S.flags[today]=S.flags[today]||[]).push(s.id)}save();var p=pts(t);
  last={ok:p>0,bad:p==0,t:'صباح الخير '+s.name.split(' ')[0]+(p>0?' ✅':''),sub:t.slice(0,5)+' · '+(p>0?'+'+p+' نقاط':'بعد الطابور — تأخر')+(fl?' ⚠️ تحقق من الطابور':'')};
  beep(p>0);draw()
}
function board(n){
  var dates=Object.keys(S.rec).sort().filter(function(d){return(new Date()-new Date(d))/864e5<n});
  return S.students.filter(function(s){return!s.bus}).map(function(s){
    var tot=0,days=0,run=0,best=0,sum=0;
    dates.forEach(function(d){var t=S.rec[d][s.id],p=t?pts(t):0;if(p>0){tot+=p;days++;sum+=+t.slice(0,2)*60+ +t.slice(3,5);run++;if(run>best)best=run}else run=0});
    var bonus=Math.floor(best/5)*5;
    return{s:s,p:tot+bonus,bonus:bonus,days:days,best:best,avg:days?sum/days:999}
  }).sort(function(a,b){return b.p-a.p||b.days-a.days||a.avg-b.avg})
}
function fm(m){return m>900?'—':pad(Math.floor(m/60))+':'+pad(Math.round(m%60))}
function draw(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var h='',v=document.getElementById('v');
  if(tab=='gate'){
    var today=S.rec[iso(new Date())]||{},ids=Object.keys(today).sort(function(a,b){return today[b]<today[a]?1:-1});
    h='<div class="c"><b>تسجيل الوصول</b><input id="idn" inputmode="numeric" placeholder="رقم الطالب (أو امسح البطاقة)" onkeydown="if(event.key==\'Enter\')go2()"><button class="b" onclick="go2()">تسجيل</button>'+
    '<button class="b s" onclick="cam()">📷 تشغيل الكاميرا لمسح QR</button><button class="b s" onclick="flip()">🔄 تبديل الكاميرا (أمامية / خلفية)</button><button class="b s" onclick="document.getElementById('pf').click()">📸 التقاط صورة للبطاقة</button><input id="pf" type="file" accept="image/*" capture="environment" style="display:none" onchange="pic(this)"><video id="vid" playsinline muted></video><div id="cm" class="note"></div>'+
    (last?'<div class="msg '+(last.ok?'ok':'bad')+'">'+last.t+(last.sub?'<small>'+last.sub+'</small>':'')+'</div>':'')+
    '<p class="note" style="margin-top:12px">وقت تجريبي (اختياري، مثل 06:20):</p><input id="tt" placeholder="اتركه فارغاً لاستخدام الوقت الحقيقي"></div>'+
    '<div class="c"><b>وصلوا اليوم ('+ids.length+')</b>'+(ids.length?ids.map(function(i){var s=find(i);return'<div class="row"><div class="gr"><b>'+(s?s.name:i)+'</b><span>'+(s?s.cls:'')+'</span></div><span>'+((S.flags&&S.flags[iso(new Date())]||[]).indexOf(i)>-1?'⚠️ ':'')+today[i].slice(0,5)+'</span></div>'}).join(''):'<p class="note">لا يوجد تسجيل بعد.</p>')+'</div>'+
    '<button class="b s" onclick="if(confirm(\'إعادة البيانات التجريبية؟\')){S=seed();save();last=null;draw()}">إعادة البيانات التجريبية</button>'
  }
  if(tab=='rank'){
    var b=board(per);
    h='<div class="seg">'+[[7,'أسبوع'],[30,'شهر'],[60,'شهران']].map(function(x){return'<button class="'+(per==x[0]?'on':'')+'" onclick="per='+x[0]+';draw()">'+x[1]+'</button>'}).join('')+'</div><div class="c">'+
    b.map(function(r,i){return'<div class="row"><div class="rk '+(i<3?'t':'')+'">'+(i+1)+'</div><div class="gr"><b>'+r.s.name+'</b><span>'+r.days+' يوم مبكر · أطول التزام '+r.best+' · متوسط '+fm(r.avg)+(r.bonus?' · مكافأة +'+r.bonus:'')+'</span></div><div class="pt">'+r.p+'</div></div>'}).join('')+'</div>'+
    '<p class="note">النقاط: قبل 6:30 = 3، حتى 6:45 = 2، بعدها 0. مكافأة +5 لكل ٥ أيام متتالية مبكرة. طلاب الباص خارج الترتيب.</p>'
  }
  if(tab=='parent'){
    h='<div class="c"><b>بوابة ولي الأمر</b><input id="pid" inputmode="numeric" placeholder="رقم الطالب، مثل 1001" value="'+(window.pidv||'')+'"><button class="b" onclick="window.pidv=document.getElementById(\'pid\').value;draw()">عرض</button><p class="note">في النسخة الحقيقية يستلم كل ولي أمر رابطاً خاصاً بابنه دون كتابة رقم.</p></div>';
    var s=window.pidv&&find(window.pidv);
    if(s){
      var w=board(7),m=board(30),rw=w.filter(function(r){return r.s.id==s.id})[0],rm=m.filter(function(r){return r.s.id==s.id})[0],ds=Object.keys(S.rec).sort().reverse().slice(0,10);
      h+='<div class="c"><b>'+s.name+'</b> <span class="note">'+s.cls+(s.bus?' · باص':'')+'</span>'+
      (rw?'<div class="stats" style="margin-top:10px"><div class="stat"><b>'+rw.p+'</b><span>نقاط الأسبوع</span></div><div class="stat"><b>'+rm.p+'</b><span>نقاط الشهر</span></div><div class="stat"><b>#'+(w.indexOf(rw)+1)+'</b><span>ترتيب الأسبوع</span></div><div class="stat"><b>'+rm.best+'</b><span>أطول التزام (شهر)</span></div></div>':'<p class="note">طالب باص: يُعرض الحضور فقط دون ترتيب.</p>')+'</div>'+
      '<div class="c"><b>آخر الأيام</b>'+ds.map(function(d){var t=S.rec[d][s.id],p=t?pts(t):0;return'<div class="row"><div class="gr"><b>'+d+'</b></div><span style="color:'+(p>0?'var(--ok)':'var(--no)')+'">'+(t?t.slice(0,5)+(p>0?' ✅':' متأخر'):'غائب')+'</span></div>'}).join('')+'</div>'
    }else if(window.pidv)h+='<div class="msg bad">رقم غير موجود</div>'
  }
  if(tab=='cards'){
    h='<button class="b noprint" onclick="window.print()">🖨️ طباعة البطاقات</button><p class="note noprint">اطبعها وغلّفها. الرقم مكتوب تحت الرمز للإدخال اليدوي.</p><div class="cards">'+
    S.students.map(function(s){var q=qrcode(0,'M');q.addData(s.id);q.make();return'<div class="card">'+q.createSvgTag(4)+'<div><b>'+s.name+'</b></div><div>'+s.cls+' · '+s.id+'</div></div>'}).join('')+'</div>'
  }
  if(tab=='set'){var C=S.cfg,fs='FaceDetector' in window;
    var row=function(k,t,d,dis){return'<div class="row"><div class="gr"><b>'+t+'</b><span>'+d+'</span></div><input type="checkbox" style="width:24px;height:24px" '+(C[k]?'checked ':'')+(dis?'disabled ':'')+'onchange="tg(\''+k+'\')"></div>'};
    h='<div class="c"><b>إجراءات منع الغش</b>'+row('gap','فاصل ٣ ثوانٍ بين المسحات','يرفض أي مسح قبل مرور ٣ ثوانٍ')+row('rapid','تنبيه المسحات المتتالية','٣ بطاقات خلال ١٠ ثوانٍ تظهر ⚠️ للمشرف')+row('face','التأكد من وجود وجه','يتطلب تشغيل الكاميرا الأمامية · '+(fs?'مدعوم في هذا الجوال':'غير مدعوم في هذا الجوال'),!fs)+row('photo','عرض صورة الطالب','قريباً — بعد جمع الصور',1)+'</div><p class="note">يمكن تفعيل أي خيار أو إلغاؤه في أي وقت. الطالب «تجربة (أنا)» رقمه 9999 لتجربتك الشخصية، وبطاقته في تبويب البطاقات.</p>'}
  v.innerHTML=h;
  if(stream&&tab=='gate'){var vv=document.getElementById('vid');if(vv){vv.srcObject=stream;vv.style.display='block';vv.play()}}
}
function go(t){stop();tab=t;draw()}
async function pic(el){var f=el.files[0],cm=document.getElementById('cm');if(!f)return;if(!('BarcodeDetector' in window)){cm.textContent='المتصفح لا يدعم قراءة QR';return}try{var bm=await createImageBitmap(f);var r=await new BarcodeDetector({formats:['qr_code']}).detect(bm);if(r.length)reg(r[0].rawValue);else cm.textContent='لم يُقرأ الرمز، أعد التصوير وقرّب البطاقة'}catch(e){cm.textContent='تعذّرت قراءة الصورة'}}
function flip(){stop();window.camMode=(window.camMode=='user')?'environment':'user';draw();cam()}
function go2(){var i=document.getElementById('idn');if(i&&i.value)reg(i.value)}
function stop(){if(scanT)clearInterval(scanT);scanT=null;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
async function cam(){
  var cm=document.getElementById('cm'),to;cm.textContent='جارٍ تشغيل الكاميرا…';
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices){cm.textContent='هذا المتصفح لا يدعم مسح QR مباشرة. استخدم Chrome على أندرويد، أو أدخل الرقم يدوياً.';return}
  try{
    to=setTimeout(function(){cm.textContent='لم تبدأ الكاميرا. غالباً الصفحة المنشورة تمنعها. استخدم نسخة ملف HTML المحمّلة في Chrome.'},6000);
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:window.camMode||'environment'}});
    var v=document.getElementById('vid');v.srcObject=stream;v.style.display='block';await v.play();clearTimeout(to);cm.textContent='';
    var det=new BarcodeDetector({formats:['qr_code']}),lastc='',lt=0;
    scanT=setInterval(async function(){try{var r=await det.detect(v);if(r.length){var c=r[0].rawValue,n=Date.now();if(c!=lastc||n-lt>4000){lastc=c;lt=n;reg(c);var v2=document.getElementById('vid');if(v2){v2.style.display='block'}}}}catch(e){}},400)
  }catch(e){clearTimeout(to);cm.textContent='تعذّر تشغيل الكاميرا. تأكد من السماح بالوصول، أو أدخل الرقم يدوياً.'}
}
draw();
</script>
</body>
</html>
